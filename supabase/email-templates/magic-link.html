<!--
  PackPerks — "Magic Link" Supabase Auth email template (OTP code version).

  Paste into:
    Supabase Dashboard → Authentication → Email Templates → "Magic Link"

  Uses {{ .Token }} so the email sends a 6-digit code instead of a click-
  through link, consistent with the signup flow. The admin console's
  "Forgot password / sign in with email" flow then uses the same OTP
  verify screen.

  Subject line (set in the dashboard, above the body):
    Your PackPerks sign-in code: {{ .Token }}
-->
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /></head>
  <body style="margin:0; padding:0; background-color:#FFF8F4; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#1A1A1A;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      Use code {{ .Token }} to sign in to PackPerks.
    </div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#FFF8F4; padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:460px; background:#FFFFFF; border-radius:22px; box-shadow:0 10px 36px rgba(20,16,12,0.08); border:1px solid rgba(0,0,0,0.04); overflow:hidden;">
          <tr><td align="center" style="padding:28px 32px 16px;">
            <div style="font-size:22px; font-weight:800; color:#E24400;">PackPerks</div>
            <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#7A7166; margin-top:6px;">Admin Console</div>
          </td></tr>
          <tr><td style="padding:8px 32px 0;">
            <h1 style="margin:0 0 8px; font-size:22px; font-weight:800;">Sign in to PackPerks</h1>
            <p style="margin:0 0 18px; font-size:14px; line-height:1.5; color:#4A4540;">Enter the code below to finish signing in.</p>
          </td></tr>
          <tr><td align="center" style="padding:8px 32px 8px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="background:#FFF6EE; border:1px solid #FFE0CC; border-radius:14px; padding:18px 28px;">
                <div style="font-family:ui-monospace,monospace; font-size:36px; font-weight:800; letter-spacing:0.4em; color:#E24400; line-height:1; text-align:center;">{{ .Token }}</div>
                <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#A85320; text-align:center; margin-top:10px;">Sign-in code</div>
              </td>
            </tr></table>
          </td></tr>
          <tr><td style="padding:18px 32px 4px;">
            <p style="margin:0; font-size:13px; color:#7A7166; line-height:1.55;">This code expires in <strong style="color:#1A1A1A;">10 minutes</strong>. If you didn't request it, you can safely ignore this email.</p>
          </td></tr>
          <tr><td style="padding:20px 32px 0;"><div style="border-top:1px solid #F0EDE8; height:1px;">&nbsp;</div></td></tr>
          <tr><td style="padding:18px 32px 28px;">
            <p style="margin:0; font-size:11px; color:#9E9A93; text-align:center; line-height:1.5;">PackPerks <span style="color:#C8C2B5;">×</span> Burger King Netherlands</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
