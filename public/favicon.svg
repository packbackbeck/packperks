<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- PackPerks favicon: filled orange disc + white cup glyph.
       Designed to read at 16×16 (browser tab) and 32×32 (bookmarks).
       Orange #FD6F46 matches the user-app accent + the empty-state cup. -->
  <circle cx="16" cy="16" r="16" fill="#FD6F46"/>
  <!-- Cup body: trapezoid with rounded corners -->
  <path d="M10.5 11h11a1 1 0 0 1 .99 1.15l-1.45 9.4a2 2 0 0 1-1.98 1.7h-5.12a2 2 0 0 1-1.98-1.7l-1.45-9.4A1 1 0 0 1 10.5 11Z"
        fill="#FFFFFF"/>
  <!-- Rim cap on top -->
  <rect x="9" y="9" width="14" height="2.6" rx="1.3" fill="#FFFFFF"/>
  <!-- Steam wisps -->
  <path d="M13.6 6.4c.6.7.6 1.5 0 2.4" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M16 5.6c.7.8.7 1.7 0 2.7" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M18.4 6.4c.6.7.6 1.5 0 2.4" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
