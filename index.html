<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PackPerks x Burger King — Collect reusable cups and earn free rewards. Return your cups and claim cashback or menu items." />
    <meta name="theme-color" content="#F5F0EB" />
    <title>PackPerks — Burger King Rewards</title>
    <!-- Browser tab icon (Chrome/Safari/Firefox). The /vite.svg default
         was deleted; pointing at the real PackPerks favicon now. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen bookmark icon (when users "Add to Home Screen").
         Re-uses the same SVG; iOS renders it at 180×180 on a white tile. -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Self-hosted DM Sans (no third-party font CDN). Preload the primary
         weight so first paint isn't blocked on the font. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
