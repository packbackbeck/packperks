<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="robots" content="noindex">
<title>PackPerks Terminal</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/nfc.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terminal">
<style>
:root {
  --bg: #05080f;
  --panel: #0b111c;
  --line: #1a2333;
  --text: #e8eef8;
  --muted: #6b7a92;
  --accent: #2f7bff;
  --accent-soft: rgba(47, 123, 255, .14);
  --accent-glow: rgba(47, 123, 255, .45);
}
body.ready {
  --accent: #22d36b;
  --accent-soft: rgba(34, 211, 107, .14);
  --accent-glow: rgba(34, 211, 107, .5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  cursor: pointer;
}
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

.screen {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  background: radial-gradient(120% 70% at 50% 45%, var(--accent-soft), transparent 70%), var(--bg);
  transition: background .6s ease;
}
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border: 2px solid var(--accent); opacity: .35; border-radius: 0;
  transition: border-color .6s ease;
}

/* status bar */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 12px; color: var(--muted); letter-spacing: .04em;
}
.bar .left, .bar .right { display: flex; align-items: center; gap: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.state { color: var(--accent); font-weight: 600; letter-spacing: .14em; transition: color .6s; }
.icon { display: inline-flex; align-items: center; gap: 4px; }
.icon svg { width: 16px; height: 16px; }
.batt { width: 22px; height: 11px; border: 1.5px solid var(--muted); border-radius: 3px; position: relative; padding: 1.5px; }
.batt::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: var(--muted); border-radius: 0 1px 1px 0; }
.batt i { display: block; height: 100%; width: 78%; background: var(--text); border-radius: 1px; }

/* middle */
.main {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(18px, 4vh, 34px); text-align: center; min-height: 0;
}
.art { width: min(86vw, 52vh, 460px); aspect-ratio: 1; position: relative; }
.art svg { position: relative; z-index: 1; width: 100%; height: 100%; overflow: visible; }
.ring { position: absolute; z-index: 0; inset: 14%; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ripple 5s ease-out infinite; }
.ring:nth-child(2) { animation-delay: 1.67s; }
.ring:nth-child(3) { animation-delay: 3.33s; }
body.ready .ring { animation-duration: 3.6s; }
body.ready .ring:nth-child(2) { animation-delay: 1.2s; }
body.ready .ring:nth-child(3) { animation-delay: 2.4s; }
@keyframes ripple { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }

.wave { stroke: var(--accent); animation: wave 1.8s ease-in-out infinite; }
.wave.w2 { animation-delay: .2s; } .wave.w3 { animation-delay: .4s; }
@keyframes wave { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

.phone { transition: opacity .5s ease; opacity: 0; }
body.ready .phone { opacity: 1; animation: approach 2.4s ease-in-out infinite; }
@keyframes approach {
  0%, 100% { transform: translate(34px, -30px) rotate(12deg); }
  45%, 60% { transform: translate(6px, -4px) rotate(4deg); }
}

h1 { font-size: clamp(42px, 11vw, 84px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.sub { font-size: clamp(22px, 5.4vw, 34px); color: var(--muted); max-width: 20ch; line-height: 1.35; }
.sub b { color: var(--text); font-weight: 600; }

.count {
  display: none; align-items: center; gap: 10px;
  font-size: 15px; color: var(--muted); letter-spacing: .06em;
}
body.ready .count { display: flex; }
.track { width: 180px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }

.view { display: contents; }
body:not(.ready) .v-ready, body.ready .v-idle { display: none; }

/* footer */
.foot {
  display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px 16px;
  font-size: 11px; color: var(--muted); letter-spacing: .05em;
  border-top: 1px solid var(--line); padding-top: 12px;
}
.foot span { white-space: nowrap; }
#dateBox { padding: 10px; margin: -10px; }
#corner { position: relative; padding: 16px 18px; margin: -16px -18px; }
#corner::after {
  content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 2px; border-radius: 1px;
  background: var(--accent); transform: scaleX(0); transform-origin: right; opacity: 0;
}
#corner.holding::after { opacity: 1; transform: scaleX(1); transition: transform .8s linear; }
#corner.armed::after { box-shadow: 0 0 8px var(--accent-glow); }

.hint {
  position: fixed; inset: 0; z-index: 10; display: none; align-items: flex-end; justify-content: center;
  padding: 16px; background: rgba(0, 0, 0, .6); cursor: default;
}
.hint.open { display: flex; }
.hint .card {
  width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 22px 20px 18px; margin-bottom: env(safe-area-inset-bottom);
}
.hint h2 { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.hint ol { list-style: none; display: grid; gap: 10px; font-size: 16px; color: var(--muted); counter-reset: s; }
.hint li { display: flex; gap: 12px; align-items: center; }
.hint li::before {
  counter-increment: s; content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--bg); background: var(--accent);
}
.hint li b { color: var(--text); font-weight: 600; }
.hint button {
  margin-top: 18px; width: 100%; height: 48px; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600;
  color: var(--bg); background: var(--accent); cursor: pointer;
}
.foot span b { color: var(--text); font-weight: 500; }
@media (max-width: 640px) {
  .foot { grid-template-columns: repeat(2, auto); }
  .bar .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="screen" id="screen">
  <header class="bar mono">
    <div class="left">
      <span class="dot"></span>
      <span class="state" id="state">IDLE</span>
      <span class="hide-sm">PACKPERKS · NFC</span>
    </div>
    <div class="right" id="corner">
      <span id="clock">--:--:--</span>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </span>
      <span class="batt" aria-hidden="true"><i></i></span>
    </div>
  </header>

  <main class="main">
    <div class="art" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <svg viewBox="0 0 200 200">
        <!-- terminal -->
        <rect x="52" y="44" width="96" height="128" rx="16" fill="#0d1522" stroke="var(--accent)" stroke-width="3"/>
        <rect x="64" y="56" width="72" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-opacity=".5" stroke-width="1.5"/>
        <!-- contactless symbol -->
        <g fill="none" stroke-width="5" stroke-linecap="round" transform="translate(100 134)">
          <path class="wave w1" d="M-14 -12 a17 17 0 0 1 0 24"/>
          <path class="wave w2" d="M-3 -19 a27 27 0 0 1 0 38"/>
          <path class="wave w3" d="M8 -26 a37 37 0 0 1 0 52"/>
        </g>
        <!-- phone -->
        <g class="phone">
          <rect x="118" y="20" width="44" height="80" rx="9" fill="#111a29" stroke="var(--text)" stroke-width="3"/>
          <rect x="133" y="26" width="14" height="3" rx="1.5" fill="var(--text)" opacity=".6"/>
          <circle cx="140" cy="62" r="9" fill="none" stroke="var(--accent)" stroke-width="3"/>
          <path d="M136 62l3 3 5-6" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <div class="view v-idle">
      <h1>Ready for cups</h1>
    </div>
    <div class="view v-ready">
      <h1>Tap your phone</h1>
      <p class="sub">Hold it here to <b>claim your reward</b></p>
      <div class="count mono"><div class="track"><i id="bar"></i></div><span id="left">60s</span></div>
    </div>
  </main>

  <footer class="foot mono">
    <span>TID <b>PPK-0417</b></span>
    <span id="dateBox">DATE <b id="date">--</b></span>
    <span>TAPS TODAY <b id="taps">0</b></span>
    <span>NFC <b>ON</b> · v2.4.1</span>
  </footer>
</div>

<div class="hint" id="hint" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
  <div class="card">
    <h2 id="hintTitle">Fullscreen on iPhone</h2>
    <ol>
      <li><span>Tap <b>•••</b>, then <b>Share</b></span></li>
      <li><span>Tap <b>View More</b>, then <b>Add to Home Screen</b></span></li>
      <li><span>Open <b>Terminal</b> from your Home Screen</span></li>
    </ol>
    <button type="button" id="hintOk">OK</button>
  </div>
</div>

<script>
(function () {
  var READY_MS = 60000;
  var body = document.body;
  var stateEl = document.getElementById('state');
  var clockEl = document.getElementById('clock');
  var dateEl = document.getElementById('date');
  var tapsEl = document.getElementById('taps');
  var barEl = document.getElementById('bar');
  var leftEl = document.getElementById('left');
  var readyUntil = 0;
  var wakeLock = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  // A believable counter: a base that grows through the day, plus real taps.
  function todayKey() { var d = new Date(); return 'ppk-nfc-taps:' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function readTaps() { try { return Number(localStorage.getItem(todayKey())) || 0; } catch (e) { return 0; } }
  function writeTaps(n) { try { localStorage.setItem(todayKey(), String(n)); } catch (e) {} }
  function baseTaps() { var d = new Date(); return Math.max(0, Math.floor((d.getHours() * 60 + d.getMinutes() - 7 * 60) / 6)); }

  function tick() {
    var d = new Date();
    clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    dateEl.textContent = pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    tapsEl.textContent = String(baseTaps() + readTaps()).padStart(4, '0');

    if (readyUntil) {
      var left = readyUntil - Date.now();
      if (left <= 0) return setIdle();
      leftEl.textContent = Math.ceil(left / 1000) + 's';
      barEl.style.transform = 'scaleX(' + (left / READY_MS) + ')';
    }
  }

  function setReady() {
    readyUntil = Date.now() + READY_MS;
    body.classList.add('ready');
    stateEl.textContent = 'READY';
    writeTaps(readTaps() + 1);
    if (navigator.vibrate) navigator.vibrate(40);
    tick();
  }
  function setIdle() {
    readyUntil = 0;
    body.classList.remove('ready');
    stateEl.textContent = 'IDLE';
    tick();
  }

  function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l; l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });

  // Hidden staff controls. A double tap runs the action; a single tap
  // still counts as a tap on the screen once the double-tap window passes.
  function onDoubleTap(el, action) {
    var last = 0;
    // Keep the screen's own tap handler off this control.
    el.addEventListener('pointerdown', function (e) { e.stopPropagation(); keepAwake(); });
    // Detect on click: on a touch screen only the release grants the user
    // activation that fullscreen needs, so pointerdown would be refused.
    el.addEventListener('click', function () {
      var now = Date.now();
      if (now - last < 400) { last = 0; action(); return; }
      last = now;
      setTimeout(function () { if (last === now && !readyUntil) setReady(); }, 400);
    });
  }

  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    var isFull = d.fullscreenElement || d.webkitFullscreenElement;
    if (isFull) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  // Date (double tap): back to idle.
  onDoubleTap(document.getElementById('dateBox'), setIdle);

  // Top-right corner (press and hold): fullscreen on / off. The hold arms it
  // and the release fires it, because on a phone only the finger lifting
  // counts as the user gesture fullscreen needs. iPhone Safari has no page
  // fullscreen at all, so there the hold explains the Home Screen route,
  // which opens this page fullscreen (nfc.webmanifest).
  var HOLD_MS = 800;
  var corner = document.getElementById('corner');
  var hint = document.getElementById('hint');
  var holdTimer = 0, armed = false, holding = false, hintOpenedAt = 0;
  function canFullscreen() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
  function isHomeScreenApp() {
    return navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  }
  function endHold() {
    clearTimeout(holdTimer); holding = false; armed = false;
    corner.classList.remove('holding', 'armed');
  }
  corner.addEventListener('pointerdown', function (e) {
    e.stopPropagation(); keepAwake();
    holding = true; armed = false;
    corner.classList.add('holding');
    holdTimer = setTimeout(function () {
      armed = true; corner.classList.add('armed');
      if (navigator.vibrate) navigator.vibrate(30);
    }, HOLD_MS);
  });
  corner.addEventListener('pointerup', function () {
    if (!holding) return;
    var wasArmed = armed;
    endHold();
    if (!wasArmed) { if (!readyUntil) setReady(); return; }
    if (canFullscreen()) toggleFullscreen();
    else if (!isHomeScreenApp()) { hintOpenedAt = Date.now(); hint.classList.add('open'); }
  });
  corner.addEventListener('pointercancel', endHold);
  corner.addEventListener('pointerleave', function () { if (holding && !armed) endHold(); });

  hint.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  hint.addEventListener('click', function (e) {
    if (Date.now() - hintOpenedAt < 500) return; // the click from the hold's own release
    if (e.target === hint || e.target.id === 'hintOk') hint.classList.remove('open');
  });

  document.addEventListener('pointerdown', function () {
    keepAwake();
    if (!readyUntil) setReady();
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
